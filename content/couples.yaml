- slug: connor-tyler
  tint: "#7FB3E0"
  image: couple-connor-tyler
  alt: >-
    Painted illustration of Connor and Tyler kissing on a brick sidewalk under
    autumn trees and gas lamps.
  name: Connor and Tyler
  billing: The foundation
  narrators: [connor, tyler]
  summary: >-
    Together five years. They met in Boston and moved to Florida about eight
    months before the book opens. Connor is ready to build: the house in Winter
    Park, the paperwork, the practical next step. Tyler cannot stop running the
    what-ifs long enough to sign anything.
  obstacle: What permanence would cost if the worst happened.

- slug: diego-noah
  tint: "#E98FAE"
  image: couple-diego-noah
  alt: >-
    Painted illustration of Noah and Diego kissing on a beach at sunset, with
    palm trees behind them.
  name: Noah and Diego
  billing: The spark
  narrators: [noah, diego]
  summary: >-
    They meet in the first chapter, on a soccer sideline on an unusually cool
    spring evening. Diego is all momentum and closes every gap he sees. Noah
    learned from five years with someone else to check warmth before trusting
    it, and the man he is falling for needs more room than Diego knows how to
    leave.
  obstacle: A past that taught Noah to treat kindness as a thing to verify.

- slug: rami-caleb
  tint: "#8FD3BC"
  image: couple-rami-caleb
  alt: >-
    Painted illustration of Rami and Caleb kissing across a candlelit table in a
    restaurant, Rami in a burgundy suit and Caleb in navy.
  name: Rami and Caleb
  billing: The slow burn
  narrators: [rami, caleb]
  summary: >-
    Longtime friends in the same circle. Rami has been quietly chasing Caleb for
    months, and Caleb has read every sign of it as ordinary friendliness,
    because it has never once occurred to him that he could be the one being
    wanted.
  obstacle: Caleb cannot let himself be chosen.
